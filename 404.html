<!DOCTYPE html>
<html>
<head>
    <title>BŁĄD 404 | NetAi</title>
    <style>
        body { 
            background: black; 
            color: #0f0; 
            font-family: Consolas; 
            padding: 40px; 
            text-align: center;
        }
        h1 { font-size: 60px; color: red; }
        p { font-size: 24px; }
    </style>
</head>
<body>
    <h1>404 | BŁĄD SYSTEMOWY</h1>
    <p>Domena <span id="domain-name"></span> nie została odnaleziona w bazie NetAi.</p>
    <p>Spróbuj innej nazwy lub kliknij <a href="/MyExplorer/domains.netai/index.html" style="color: lime;">RELOAD</a>.</p>
    <hr>
    <p>Pamiętaj: MÓJ INTERNET 2025 działa tylko z zarejestrowanymi domenami!</p>

    <script>
        const domain = window.location.pathname.split('/')[2];
        document.getElementById('domain-name').textContent = domain.replace('.html', '');
    </script>
</body>
</html>
