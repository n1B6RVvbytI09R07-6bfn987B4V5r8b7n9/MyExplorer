<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kup Domeny – Mój Internet 2025</title>
    <style>
        body { background: black; color: #0f0; font-family: Consolas; padding: 40px; }
        
        /* Zmieniono tło body na BLACK i text na LIME (#0f0) */
        input[type="text"] { background: black; color: #0f0; padding: 10px; font-size: 16px; margin-right: 10px; border: 2px solid #0f0; border-radius: 8px; }
        button { background: #0f0; color: black; font-weight: bold; cursor: pointer; padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; transition: background 0.3s; }
        button:hover { background: #0a0; }
        button:disabled { background: #555; cursor: not-allowed; color: #aaa; } 
        #wynik { font-size: 20px; margin: 20px; }
        hr { border: 1px solid #0f0; }
        /* Nowy styl dla komunikatu o błędzie symulacji PHP */
        .error-php { color: #f00; font-weight: bold; margin-top: 15px; border: 2px solid #f00; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Kup Domeny w Moim Internecie (Tryb PHP Symulowany)</h1>
    <p>Wpisz nazwę domeny (np. <code>domena.pl</code>), aby sprawdzić, czy jest wolna.</p>

    <input type="text" id="domena" placeholder="np. google.com" size="50">
    <button onclick="sprawdzDostepnosc()">Sprawdź dostępność</button>

    <p id="wynik"></p>
    <hr>
    <!-- Przycisk kupowania teraz wywoła symulowane żądanie HTTP -->
    <button id="kup_przycisk" onclick="kupDomena()" style="padding:15px 40px;font-size:20px;">KUP TĘ DOMENĘ TERAZ</button>

    <script>
        // UWAGA: Mechanizm komunikacji zmienia się z protokołu 'app-action:' na symulowane żądanie HTTP.
        // Aplikacja Pythona musi być zmodyfikowana, aby przechwytywać te żądania HTTP.
        
        const BASE = "https://n1b6rvvbyti09r07-6bfn987b4v5r8b7n9.github.io/MyExplorer";
        const KUP_PRZYCISK = document.getElementById('kup_przycisk');
        const WYNIK = document.getElementById('wynik');
        const DOZWOLONE_KONCOWKI = ['.pl', '.com', '.net', '.org'];
        let domenaDostepna = false;

        wylaczPrzycisk(); // Wyłącz przycisk na starcie

        function wylaczPrzycisk() {
            KUP_PRZYCISK.disabled = true;
        }

        function wlaczPrzycisk() {
            KUP_PRZYCISK.disabled = false;
        }
        
        // --- NOWA FUNKCJA OBSŁUGUJĄCA ODPOWIEDZI Z SERWERA (Symulacja PHP) ---
        function handleResponse(data) {
            wlaczPrzycisk(); // Zawsze włączamy przycisk po otrzymaniu odpowiedzi
            
            if (data.status === 'success') {
                WYNIK.innerHTML = `<span style='color:lime'>SUKCES: Domena <b>${data.domena}</b> została utworzona LOKALNIE! Przeładowuję.</span>`;
                WYNIK.style.color = "lime";
                
                // W trybie PHP-symulacji, przekierowujemy na stronę rejestratora po sukcesie
                window.location.href = `${BASE}/domains.netai/index.html`; 
            } else {
                WYNIK.innerHTML = `<div class="error-php">BŁĄD ZAKUPU (PHP Sim): ${data.message}</div>`;
                WYNIK.style.color = "red";
            }
        }
        // ---------------------------------------------------------------------

        function sprawdzDostepnosc() {
            const domena = document.getElementById('domena').value.trim();
            domenaDostepna = false;
            wylaczPrzycisk();

            if (!domena) {
                WYNIK.innerHTML = "<span style='color:red'>Podaj nazwę domeny!</span>";
                return;
            }

            // --- 1. WALIDACJA KOŃCÓWKI ---
            const koncowka = domena.substring(domena.lastIndexOf('.')).toLowerCase();
            if (DOZWOLONE_KONCOWKI.indexOf(koncowka) === -1) {
                WYNIK.innerHTML = `<span style='color:red'>Niedozwolona końcówka: <b>${koncowka}</b>. Dozwolone: ${DOZWOLONE_KONCOWKI.join(', ')}.</span>`;
                return;
            }
            // -----------------------------

            WYNIK.innerHTML = "Sprawdzam...";
            WYNIK.style.color = "gray";

            // Sprawdzamy, czy istnieje folder/domena/index.html na GitHub Pages
            fetch(`${BASE}/${domena}/index.html`, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        WYNIK.innerHTML = `ZAJĘTA – domena <b>${domena}</b> już istnieje!`;
                        WYNIK.style.color = "red";
                    } else {
                        WYNIK.innerHTML = `DOSTĘPNA! Domena <b>${domena}</b> jest wolna!<br>Możesz ją kupić!`;
                        WYNIK.style.color = "lime";
                        domenaDostepna = true;
                        wlaczPrzycisk(); // Włącz przycisk tylko, gdy jest wolna
                    }
                })
                .catch(() => {
                    // W przypadku błędu sieci, traktujemy jako dostępną
                    WYNIK.innerHTML = `DOSTĘPNA! Domena <b>${domena}</b> jest wolna!<br>Możesz ją kupić!`;
                    WYNIK.style.color = "lime";
                    domenaDostepna = true;
                    wlaczPrzycisk(); 
                });
        }

        function kupDomena() {
            const domena = document.getElementById('domena').value.trim();
            
            if (!domena) {
                WYNIK.innerHTML = "<span style='color:red'>Najpierw wpisz domenę!</span>";
                return;
            }

            if (!domenaDostepna) {
                WYNIK.innerHTML = "<span style='color:red'>Nie można kupić: domena nie została sprawdzona lub jest zajęta!</span>";
                return;
            }
            
            wylaczPrzycisk();
            WYNIK.innerHTML = "Wysyłanie żądania zakupu do symulowanego skryptu PHP...";
            WYNIK.style.color = "yellow";

            // --- NOWA KOMUNIKACJA: Symulacja żądania HTTP do skryptu PHP ---
            // Zmieniamy adres URL, co wywoła zdarzenie EVT_WEBVIEW_NAVIGATING w Pythonie,
            // które teraz musi przechwycić ścieżkę do skryptu PHP.
            // Używamy protokołu 'http', który Python musi przechwycić.
            window.location.href = `http://php-simulacja/kup_domene.php?domena=${encodeURIComponent(domena)}`;
        }

        // Deklarujemy globalnie, ale bez definicji, bo będą używane jako callbacki po symulacji PHP w Pythonie.
        window.kupowanieSukces = handleResponse;
        window.kupowanieBłąd = handleResponse; 
    </script>
</body>
</html>
