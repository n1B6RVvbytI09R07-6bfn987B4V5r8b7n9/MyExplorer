<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kup Domeny</title>
</head>
<body>

<h1>Kup Domeny</h1>
<p>Jeśli chcesz sprawdzić dostępność pliku, wpisz ścieżkę poniżej.</p>

<input type="text" id="sciezkaDoPliku" placeholder="Wpisz ścieżkę pliku (np. ../dane/plik.txt)" size="50">

<button onclick="sprawdzPlik()">Sprawdź dostępność</button>
<p id="wynik"></p>

<hr>

<form action="buy.html">
  <input type="submit" value="Kup domene"/>
</form>

<script>
function sprawdzPlik() {
    // 2. POBRANIE WARTOŚCI Z INPUTA ZA POMOCĄ ID
    const sciezkaPliku = document.getElementById('sciezkaDoPliku').value;
    const wynikElement = document.getElementById('wynik');

    // Walidacja, czy pole nie jest puste
    if (!sciezkaPliku) {
        wynikElement.textContent = 'Proszę podać ścieżkę pliku.';
        wynikElement.style.color = 'red';
        return;
    }
    
    wynikElement.textContent = 'Trwa sprawdzanie...';
    wynikElement.style.color = 'gray';

    // 3. Użycie pobranej ścieżki w funkcji fetch()
    fetch(sciezkaPliku, { method: 'HEAD' })
        .then(response => {
            // response.ok to true dla statusów 200-299
            if (response.ok) {
                console.log(`Plik: ${sciezkaPliku} - ISTNIEJE (Status: ${response.status})`);
                wynikElement.textContent = `✅ Plik dostępny: ${sciezkaPliku}`;
                wynikElement.style.color = 'green';
            } else if (response.status === 404) {
                console.log(`Plik: ${sciezkaPliku} - NIE ISTNIEJE (Status: ${response.status})`);
                wynikElement.textContent = `❌ Plik NIE ISTNIEJE pod tym adresem.`;
                wynikElement.style.color = 'red';
            } else {
                 console.log(`Plik: ${sciezkaPliku} - BŁĄD (Status: ${response.status})`);
                 wynikElement.textContent = `⚠️ Błąd dostępu (Status: ${response.status}).`;
                 wynikElement.style.color = 'orange';
            }
        })
        .catch(error => {
            console.error('Wystąpił błąd sieci lub CORS:', error);
            wynikElement.textContent = '❗ Wystąpił błąd sieci lub problem z uprawnieniami (CORS).';
            wynikElement.style.color = 'darkred';
        });
}
</script>

</body>
</html>
