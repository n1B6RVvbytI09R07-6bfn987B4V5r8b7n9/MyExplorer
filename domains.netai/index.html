<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kup Domeny</title>
</head>
<body>

<h1>Kup Domeny</h1>
<p>Wpisz nazwe domeny (np. domena.org), aby sprawdzić jego dostępność.</p>

<input type="text" id="nazwaWzgledna" placeholder="Wpisz nazwę domeny" size="50">
<button onclick="sprawdzPlik()">Sprawdź dostępność</button>
<p id="wynik"></p>

<hr>

<form action="buy.html">
  <input type="submit" value="Kup domene"/>
</form>

<script>
function sprawdzPlik() {
    const nazwaWpisana = document.getElementById('nazwaWzgledna').value.trim(); // Pobierz i usuń białe znaki
    const wynikElement = document.getElementById('wynik');

    if (!nazwaWpisana) {
        wynikElement.textContent = 'Proszę podać nazwę pliku lub folderu.';
        wynikElement.style.color = 'red';
        return;
    }

    // ⭐ KLUCZOWA ZMIANA: Automatycznie dodajemy "../"
    const sciezkaPliku = '../' + nazwaWpisana;
    
    wynikElement.textContent = `Trwa sprawdzanie ścieżki: ${sciezkaPliku} ...`;
    wynikElement.style.color = 'gray';

    // Wysłanie żądania HEAD
    fetch(sciezkaPliku, { method: 'HEAD' })
        .then(response => {
            if (response.ok) {
                wynikElement.textContent = `✅ Znaleziono: ${sciezkaPliku} (Status: ${response.status})`;
                wynikElement.style.color = 'green';
            } else if (response.status === 404) {
                wynikElement.textContent = `❌ Nie znaleziono: ${sciezkaPliku} (Status: ${response.status})`;
                wynikElement.style.color = 'red';
            } else {
                 wynikElement.textContent = `⚠️ Błąd dostępu do: ${sciezkaPliku} (Status: ${response.status})`;
                 wynikElement.style.color = 'orange';
            }
        })
        .catch(error => {
            console.error('Wystąpił błąd sieci lub CORS:', error);
            wynikElement.textContent = '❗ Błąd sieci lub uprawnień (CORS).';
            wynikElement.style.color = 'darkred';
        });
}
</script>

</body>
</html>
