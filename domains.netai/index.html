<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kup Domeny – Mój Internet 2025</title>
    <style>
        body { background: black; color: #0f0; font-family: Consolas; padding: 40px; }
        input, button { padding: 12px; font-size: 18px; margin: 10px; background: #000; color: #0f0; border: 2px solid #0f0; border-radius: 8px; }
        button { background: #0f0; color: black; font-weight: bold; cursor: pointer; }
        #wynik { font-size: 20px; margin: 20px; }
        hr { border: 1px solid #0f0; }
    </style>
</head>
<body>
    <h1>Kup Domeny w Moim Internecie</h1>
    <p>Wpisz nazwę domeny (np. <code>domena.pl</code>), aby sprawdzić, czy jest wolna.</p>

    <input type="text" id="domena" placeholder="np. google.com" size="50">
    <button onclick="sprawdzDostepnosc()">Sprawdź dostępność</button>

    <p id="wynik"></p>
    <hr>
    <button onclick="kupDomena()" style="padding:15px 40px;font-size:20px;">KUP TĘ DOMENĘ TERAZ</button>

    <script>
        const BASE = "https://n1b6rvvbyti09r07-6bfn987b4v5r8b7n9.github.io/MyExplorer";

        function sprawdzDostepnosc() {
            const domena = document.getElementById('domena').value.trim();
            const wynik = document.getElementById('wynik');

            if (!domena) {
                wynik.innerHTML = "<span style='color:red'>Podaj nazwę domeny!</span>";
                return;
            }

            wynik.innerHTML = "Sprawdzam...";
            wynik.style.color = "gray";

            // Sprawdzamy, czy istnieje folder/domena/index.html
            fetch(`${BASE}/${domena}/index.html`, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        wynik.innerHTML = `ZAJĘTA – domena <b>${domena}</b> już istnieje!`;
                        wynik.style.color = "red";
                    } else {
                        wynik.innerHTML = `DOSTĘPNA! Domena <b>${domena}</b> jest wolna!<br>Możesz ją kupić!`;
                        wynik.style.color = "lime";
                    }
                })
                .catch(() => {
                    wynik.innerHTML = `DOSTĘPNA! Domena <b>${domena}</b> jest wolna!<br>Możesz ją kupić!`;
                    wynik.style.color = "lime";
                });
        }

        function kupDomena() {
            const domena = document.getElementById('domena').value.trim();
            if (!domena) {
                alert("Najpierw wpisz domenę!");
                return;
            }
            alert(`Kupiono domenę: ${domena}\n\nOd teraz należy do Ciebie w moim internecie!`);
            // tutaj możesz dodać zapis do pliku / bazy / itp.
        }
    </script>
</body>
</html>
